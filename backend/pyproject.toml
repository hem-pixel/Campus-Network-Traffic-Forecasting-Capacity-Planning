[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-capacity-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pandas>=2.2", "numpy>=1.26", "statsmodels>=0.14", "scikit-learn>=1.5", "sqlalchemy>=2.0", "python-multipart>=0.0.9", "argon2-cffi>=23.1", "PyJWT>=2.9", "psycopg[binary]>=3.2", "email-validator>=2.2", "reportlab>=4.2"]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]
